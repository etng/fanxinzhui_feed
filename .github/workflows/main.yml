name: Generate gh-pages and publish them

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Push
    steps:
      - name: git-checkout
        uses: actions/checkout@v7
      - name: "use node version 24.*"
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install all dependencies
        run: npm install

      - name: Build
        run: npm run update

      - name: Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_NAME: etng
          COMMIT_EMAIL: 547+etng@users.noreply.github.com
        run: |
          set -euo pipefail
          message="Build: ($(git rev-parse --short HEAD)) $(git log -1 --pretty=%s)"
          workdir="$(mktemp -d)"
          git -C "$workdir" init -q -b gh-pages
          rsync -a data/dist/ "$workdir/"
          git -C "$workdir" config user.name "$COMMIT_NAME"
          git -C "$workdir" config user.email "$COMMIT_EMAIL"
          git -C "$workdir" add -A
          git -C "$workdir" commit -q -m "$message"
          git -C "$workdir" push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
