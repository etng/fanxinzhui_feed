name: hourly fetch and pushlish to gh-pages

on:
  workflow_dispatch:
  schedule:
    - cron:  '6 * * * *'

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Push
    steps:
      - name: git-checkout
        uses: actions/checkout@v7
      - name: "use node version 24.*"
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install all dependencies
        run: npm install

      - name: Build
        run: npm run update

      - name: Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_NAME: etng
          COMMIT_EMAIL: 547+etng@users.noreply.github.com
        run: |
          set -euo pipefail
          message="Build: ($(git rev-parse --short HEAD)) $(git log -1 --pretty=%s)"
          workdir="$(mktemp -d)"
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$workdir"
          rsync -a --delete --exclude '.git' data/dist/ "$workdir/"
          git -C "$workdir" config user.name "$COMMIT_NAME"
          git -C "$workdir" config user.email "$COMMIT_EMAIL"
          git -C "$workdir" add -A
          git -C "$workdir" commit --allow-empty -m "$message"
          git -C "$workdir" push origin gh-pages

      - name: finish
        run: echo "I am done now"
